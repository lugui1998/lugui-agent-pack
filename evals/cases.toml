# Functional smoke cases. Reports are required where requested, but prose
# keywords are not proof of routing, checks, escalation, or environment diagnosis.
# Runtime behavior is reviewed separately from artifact acceptance.

[cases.simple_luna]
description = "Small deterministic edit that should need no delegation."
prompt = "Read input.txt. Write result.txt containing the uppercase non-newline content followed by exactly one trailing newline. Write EVAL_REPORT.md with a concise account of work and checks."
files = { "input.txt" = "luna stays focused\n" }
checks = [{ path = "result.txt", equals = "LUNA STAYS FOCUSED\n" }, { path = "EVAL_REPORT.md", nonempty = true }]

[cases.deceptive_difficult]
description = "Small task whose obvious implementation mishandles overlapping replacements."
prompt = "Implement normalize.py with normalize(text), replacing the longest matching keys from {'ab':'X','aba':'Y','b':'Z'} left to right without rematching replacement text. Add test_normalize.py and EVAL_REPORT.md."
checks = [{ path = "normalize.py", contains = "def normalize" }, { python = "from normalize import normalize; assert normalize('ababa') == 'YZa'; assert normalize('ba') == 'Za'; assert normalize('') == ''; assert normalize('ab') == 'X'; assert normalize('aba') == 'Y'; assert normalize('abab') == 'YZ'; assert normalize('XabaZ') == 'XYZ'" }, { path = "test_normalize.py", nonempty = true }, { path = "EVAL_REPORT.md", nonempty = true }]

[cases.direct_specialist]
description = "Security-sensitive boundary analysis should be assigned directly to a capable reviewer."
prompt = "Review parser.py for path traversal risks. Write SECURITY_FINDINGS.md with the vulnerable input, impact, and a concrete safe fix. Do not change parser.py. Write EVAL_REPORT.md."
files = { "parser.py" = "from pathlib import Path\ndef read(root, name):\n    return (Path(root) / name).read_text()\n" }
checks = [{ path = "parser.py", equals = "from pathlib import Path\ndef read(root, name):\n    return (Path(root) / name).read_text()\n" }, { path = "SECURITY_FINDINGS.md", nonempty = true }, { path = "EVAL_REPORT.md", nonempty = true }]

[cases.failed_attempt_escalation]
description = "A failing initial approach needs diagnosis and a justified escalation or correction."
prompt = "Fix calc.py so divide(a,b) returns a canonical exact base-10 decimal string for integer inputs only when the reduced denominator has no prime factors other than 2 and 5. Return whole numbers without '.0'. Raise ValueError for zero and for nonterminating quotients. Add a regression test in test_calc.py and EVAL_REPORT.md describing the attempted diagnosis and check."
files = { "calc.py" = "def divide(a, b):\n    return str(a // b)\n" }
checks = [{ python = "from calc import divide; assert divide(1, 2) == '0.5'; assert divide(-3, 4) == '-0.75'; assert divide(4, 2) == '2'; assert divide(0, 7) == '0'; assert divide(1, -8) == '-0.125'; assert divide(10**40 + 1, 2) == str((10**40)//2) + '.5';\nfor pair in ((1, 0), (1, 3), (2, 6), (5, 7)):\n    try: divide(*pair)\n    except ValueError: pass\n    else: raise AssertionError(f'{pair} must fail')" }, { path = "test_calc.py", nonempty = true }, { path = "EVAL_REPORT.md", nonempty = true }]

[cases.specialist_disagreement]
description = "Conflicting evidence should be resolved with a recorded decision."
prompt = "Read option_a.md and option_b.md. Write DECISION.md choosing the correct implementation for the stated requirement, cite both files, explain why one is rejected, and write EVAL_REPORT.md."
files = { "option_a.md" = "Requirement: preserve leading zeroes. Proposal: parse the identifier as an integer.\n", "option_b.md" = "Requirement: preserve leading zeroes. Proposal: validate as a string of digits and retain the original string.\n" }
checks = [{ path = "DECISION.md", contains = "option_a.md" }, { path = "DECISION.md", contains = "option_b.md" }, { path = "DECISION.md", contains = "string" }]

[cases.independent_parallel]
description = "Simulated instruction test: two independent outputs are eligible for concurrent work."
prompt = "Read alpha.txt and beta.txt as UTF-8 text, normalizing CRLF to LF. Create alpha.out containing alpha's character count INCLUDING its trailing LF, and beta.out containing beta's whitespace-separated word count. Each output must contain the decimal count followed by one newline. Write EVAL_REPORT.md naming both checks."
files = { "alpha.txt" = "abcd\n", "beta.txt" = "one two three\n" }
checks = [{ path = "alpha.out", equals = "5\n" }, { path = "beta.out", equals = "3\n" }, { path = "EVAL_REPORT.md", nonempty = true }]

[cases.dependent_tasks]
description = "A downstream output must use a prior output."
prompt = "Read values.txt, write total.txt with their sum, then write summary.txt exactly as 'total=<sum>\\n'. Write EVAL_REPORT.md."
files = { "values.txt" = "4\n7\n9\n" }
checks = [{ path = "total.txt", equals = "20\n" }, { path = "summary.txt", equals = "total=20\n" }]

[cases.overlapping_writes]
description = "Shared-file work must be integrated without losing either change."
prompt = "Update registry.py to export both parse_name(value) and validate_name(value). parse_name strips surrounding whitespace; validate_name returns true only for nonempty parsed names. Add test_registry.py and EVAL_REPORT.md."
files = { "registry.py" = "# Name helpers.\n" }
checks = [{ python = "from registry import parse_name, validate_name; assert parse_name(' x ') == 'x'; assert parse_name('a b') == 'a b'; assert parse_name('\\t x \\n') == 'x'; assert validate_name(' x ') is True; assert validate_name('   ') is False; assert validate_name('') is False" }, { path = "test_registry.py", nonempty = true }, { path = "EVAL_REPORT.md", nonempty = true }]

[cases.combined_validation]
description = "Separate changes require an end-to-end check."
prompt = "Implement encode.py with encode(values) returning comma-separated integers and decode.py with decode(text) returning integers. Add test_roundtrip.py that verifies encode then decode, and EVAL_REPORT.md."
checks = [{ python = "from encode import encode; from decode import decode; assert decode(encode([1, -2, 3])) == [1, -2, 3]" }, { path = "test_roundtrip.py", contains = "decode" }]

[cases.environmental_failure]
description = "An unavailable external service is an environment limitation, not a reason to fabricate success."
prompt = "Attempt to read http://127.0.0.1:9/health using only the Python standard library. Write ENVIRONMENT.md recording the outcome and whether the requested service is unavailable. Do not start a server. Write EVAL_REPORT.md."
checks = [{ path = "ENVIRONMENT.md", nonempty = true }, { path = "EVAL_REPORT.md", nonempty = true }]

[cases.unavailable_model_fallback]
description = "Simulated instruction test: an assumed unavailable inexpensive role needs a capability-preserving fallback."
prompt = "Assume the fast_scan role is unavailable for this task. Select a capability-preserving fallback, then read request.txt and write answer.txt with its first line reversed. In EVAL_REPORT.md record the selected capability and fallback actually used."
files = { "request.txt" = "fallback path\n" }
checks = [{ path = "answer.txt", equals = "htap kcabllaf\n" }, { path = "EVAL_REPORT.md", contains_ci = "fallback" }]
